# Dependency audit policy (task B-001 AC1: "warnings and dependency audit policy
# are enforced"). Checked with `cargo deny check` using the cargo-deny version
# recorded in the release evidence.
[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# The three workspace crates are unpublished (`publish = false`) and carry no
# license expression; third-party dependencies are still audited below.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  # The native watcher backend (B-021) is the CC0-1.0 `notify` crate. CC0-1.0 is
  # a permissive public-domain dedication with no attribution or copyleft term,
  # so it is allowed for the same reason MIT and Apache-2.0 are.
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
