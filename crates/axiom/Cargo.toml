[package]
name = "axiom"
description = "Axiom installation, bootstrap and operations CLI core: canonical plans, host discovery, verified install, service lifecycle and uninstall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
graph-core.workspace = true
# The one canonical byte encoder in this workspace (B-067). The plan digest is
# defined over those bytes plus the trailing newline, so a second encoder here
# would be a second digest contract.
graph-export.workspace = true
# The store owns the patched-SQLite runtime gate (I-004): the ecosystem
# prerequisite report renders its WAL baseline from the store's own constant
# instead of copying the version, so a baseline change moves the report with it.
graph-store.workspace = true
serde.workspace = true
serde_json.workspace = true
axiom-platform = { version = "0.1.0", path = "../platform" }
getrandom.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The daemon is the other half of the core release; tests compare both halves
# so a drifting second version fails here instead of at release time.
axiom-graphd = { version = "0.1.0", path = "../axiom-graphd" }
# Fixture trees for the read-only discovery tests (E-003): tests build a home
# in a temporary directory so nothing under the real AXIOM_HOME is touched.
